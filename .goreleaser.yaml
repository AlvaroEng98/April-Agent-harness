version: 2
project_name: apil
before:
  hooks:
    - go mod tidy
builds:
  - binary: apil
    main: .
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "checksums.txt"
# El changelog automático de commits queda desactivado: las notas salen de
# CHANGELOG.md, que es el registro curado de features entregadas. El workflow
# de release extrae la sección de la versión con ./release-notes.sh y la
# expone como RELEASE_NOTES. No se lee feature_list.json porque no está
# versionado (es estado de desarrollo) y el checkout de CI no lo tiene.
changelog:
  disable: true
# Sin bloque `github:` a propósito: goreleaser deduce owner/repo del entorno
# (GITHUB_REPOSITORY en Actions, o el remote origin en local). Fijarlos a mano
# rompe el release si el repo se renombra o se mueve, porque el GITHUB_TOKEN
# que inyecta Actions solo tiene permiso sobre el repo donde corre el workflow.
release:
  header: |
    {{ .Env.RELEASE_NOTES }}
