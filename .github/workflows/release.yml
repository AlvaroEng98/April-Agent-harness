name: release

# Se dispara solo al empujar un tag vX.Y.Z. goreleaser necesita el tag en HEAD.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necesario para crear la release y subir los binarios

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # goreleaser necesita el historial completo para el changelog

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Los tests son la puerta: si fallan, no se publica release.
      - name: Test
        run: go test ./...

      # Las notas salen de CHANGELOG.md (versionado), no de feature_list.json
      # (gitignoreado, ausente en el checkout). goreleaser las consume via
      # release.header -> {{ .Env.RELEASE_NOTES }}.
      # Las notas se capturan en una variable ANTES de abrir el here-doc: si el
      # script falla, set -e aborta sin haber escrito nada en $GITHUB_ENV. Si se
      # invocara dentro del bloque, el delimitador de cierre no se escribiría y
      # el error real quedaría tapado por "Matching delimiter not found".
      # No se usa `|| true`: sin notas no se publica release.
      - name: Notas de release desde CHANGELOG.md
        run: |
          NOTES="$(./release-notes.sh "${GITHUB_REF_NAME}")"
          {
            echo "RELEASE_NOTES<<GORELEASER_EOF"
            printf '%s\n' "$NOTES"
            echo "GORELEASER_EOF"
          } >> "$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
