name: release

# Se dispara solo al empujar un tag vX.Y.Z. goreleaser necesita el tag en HEAD.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # necesario para crear la release y subir los binarios

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser necesita el historial completo para el changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Los tests son la puerta: si fallan, no se publica release.
      - name: Test
        run: go test ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
